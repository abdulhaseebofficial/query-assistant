<div class="topbar">
    <div class="topbar-inner">
        <a class="topbar-brand" href="/">Query Assistant</a>
        <div class="topbar-actions">
            <a class="topbar-link" href="/sql">SQL Editor</a>
            <a class="topbar-link" href="/learn">Learn SQL</a>
            {% if current_user.is_authenticated %}
            <a class="topbar-link" href="/history">History</a>
            <span class="topbar-user">{{ current_user.username }}</span>
            <form action="/logout" method="POST" class="topbar-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="topbar-link">Log out</button>
            </form>
            {% else %}
            <a class="topbar-link" href="/login">Log in</a>
            <a class="topbar-link" href="/register">Sign up</a>
            {% endif %}
            <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
                <span class="theme-toggle-icon" id="theme-toggle-icon">&#9789;</span>
            </button>
        </div>
    </div>
</div>
