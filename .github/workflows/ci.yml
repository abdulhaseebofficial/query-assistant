name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Run the test suite
        run: pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting and lint rules
        run: |
          ruff check .
          python scripts/check_architecture.py
          python scripts/generate_structure.py --check
          python -m compileall -q src tests api run.py

  smoke:
    name: App starts and serves traffic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Boot the app and hit it over HTTP
        env:
          SECRET_KEY: ci-smoke-test-key
        run: |
          python run.py &
          APP_PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/ > /dev/null; then
              echo "App responded."
              break
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:5000/?q=employees+in+the+IT+department" | grep -q "SELECT"
          echo "Generated SQL rendered on the page."
          kill $APP_PID

      - name: Verify factory and Vercel entry point
        run: python scripts/verify_deployment.py
