<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Query Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include 'partials/_nav.html' %}
    <div class="frame">
        <div class="container container-narrow">
            <header>
                <h1>Sign Up</h1>
                <p class="subtitle">Create an account to save your query history.</p>
            </header>

            {% if error %}
            <div class="no-results" style="margin-bottom: 24px;">
                <p class="no-results-title">Couldn't create your account</p>
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <form action="/register" method="POST" class="upload-form">
                <label class="upload-field">
                    <span class="upload-label">Username</span>
                    <input type="text" name="username" pattern="[a-zA-Z0-9_]{3,30}" title="3-30 characters: letters, numbers, underscores" required autofocus>
                </label>
                <label class="upload-field">
                    <span class="upload-label">Email</span>
                    <input type="email" name="email" required>
                </label>
                <label class="upload-field">
                    <span class="upload-label">Password</span>
                    <input type="password" name="password" minlength="6" required>
                </label>
                <button type="submit">Create Account</button>
            </form>

            <div class="upload-notes">
                <p>Already have an account? <a class="nav-link" href="/login" style="display:inline;">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
